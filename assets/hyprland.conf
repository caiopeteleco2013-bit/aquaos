# Hyprland configurado com o comportamento e o visual do macOS:
# janelas flutuantes, cantos arredondados, blur, sombras suaves,
# gestos de swipe e a lógica "SUPER = tecla ⌘ (Command)".

monitor = , preferred, auto, 1

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Bibata-Modern-Ice

# ============================ agentes de sessão ============================
exec-once = /run/current-system/sw/libexec/polkit-gnome/polkit-gnome-authentication-agent-1

# ======================= papel de parede estilo Sonoma =====================
exec-once = swww-daemon
exec-once = sh -c "sleep 1; swww img /run/current-system/sw/share/backgrounds/sonoma.png"

# ===================== barra de menu (topo) + Dock (baixo) =================
exec-once = waybar
exec-once = sh -c "mkdir -p \"$HOME/.config/nwg-dock\"; test -e \"$HOME/.config/nwg-dock/pinned\" || cp /etc/aquaos/nwg-dock-pinned \"$HOME/.config/nwg-dock/pinned\""
exec-once = nwg-dock-hyprland -i 46

# Na ISO: abre o instalador AquaOS automaticamente (sem efeito em sistemas
# instalados — o marcador /etc/aquaos/live só existe na ISO).
exec-once = sh -c "test -e /etc/aquaos/live && pkexec env QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=$WAYLAND_DISPLAY XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR calamares"

# ============================== estética geral =============================
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 10
        passes = 2
    }
    drop_shadow = true
    shadow_range = 40
    shadow_render_power = 3
    col.shadow = rgba(00000044)
}

animations {
    enabled = true
    bezier = mac, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, mac, popin 85%
    animation = windowsOut, 1, 4, mac, popin 85%
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, mac, slidefade 40%
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

input {
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Janelas flutuam por padrão (como no macOS). SUPER+Shift+F alterna o modo
# mosaico para organizar manualmente.
windowrulev2 = float, class:^(.*)$

# =========================== atalhos (SUPER = ⌘) ===========================
$term = kitty
$menu = wofi --show drun --prompt "Buscar" --style /etc/aquaos/wofi.css

bind = SUPER, Return, exec, $term          # Terminal
bind = SUPER, E, exec, nautilus            # Finder
bind = SUPER, Space, exec, $menu           # Spotlight
bind = SUPER, Q, killactive                # Fechar janela (⌘Q)
bind = SUPER, Up, fullscreen, 0            # Botão verde: tela cheia
bind = SUPER CONTROL, F, fullscreen, 0     # Tela cheia (⌃⌘F)
bind = SUPER SHIFT, F, togglefloating      # Liga/desliga mosaico (⇧⌘F)
bind = SUPER SHIFT, Q, exit                # Encerrar sessão (⇧⌘Q) → tela de login

# Captura de tela: ⇧⌘3 tela inteira, ⇧⌘4 área selecionada
bind = SUPER SHIFT, S, exec, sh -c 'mkdir -p "$HOME/Imagens" && grim "$HOME/Imagens/AquaOS-$(date +%s).png"'
bind = SUPER SHIFT, A, exec, sh -c 'mkdir -p "$HOME/Imagens" && grim -g "$(slurp)" "$HOME/Imagens/AquaOS-$(date +%s).png"'

# Espaços de trabalho (como os Spaces do macOS)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, Left, workspace, e-1
bind = SUPER, Right, workspace, e+1

# Volume e microfone
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
