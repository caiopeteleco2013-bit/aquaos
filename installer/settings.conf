# Configuração principal do Calamares — AquaOS
#
# Baseado no settings.conf oficial do calamares-nixos-extensions (do nixpkgs),
# com as mudanças do AquaOS:
#   * branding e módulo próprios ("aquaos") substituem o "nixos" upstream;
#   * packagechooser e notesqml@unfree removidos — o sistema alvo é sempre
#     a plataforma AquaOS (modules/base.nix), em todas as máquinas.
#
# O Calamares busca este arquivo em /etc/calamares ANTES do wrapper da
# extensão oficial (XDG_CONFIG_DIRS), por isso os overrides valem aqui.
---
# "local" resolve os módulos básicos no LIBDIR do próprio Calamares;
# o segundo caminho traz o módulo "aquaos" (module.desc + main.py).
modules-search: [ local, /etc/calamares/modules ]

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - users
    - partition
    - summary
- exec:
    - partition
    - mount
    - aquaos
    - users
    - umount
- show:
    - finished

branding: aquaos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
